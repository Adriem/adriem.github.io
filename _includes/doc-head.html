<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#9a918d"> <!-- Chrome bar color -->

  <title>
    {% if page.meta_title %}
      {{ page.meta_title | escape }}
    {% else %}
      {{ site.meta_title | escape }}
    {% endif %}
  </title>

  <meta name="description"
        content="{% if page.excerpt %}
                   {{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}
                 {% else %}
                   {{ site.description }}
                 {% endif %}">

  <link rel="shortcut icon"
        href="{{ "/assets/img/favicon.png?ver2" | prepend: site.github.url }}">


  <!-- STYLES -->

  <!-- TODO: Replace with a personalised Font Awesome kit
       See: https://docs.fontawesome.com/web/setup/use-kit -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- Montserrat, only the weights in use (see _sass/_typography.scss) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap">


  <link rel="stylesheet"
        href="{{ "/assets/styles.css" | prepend: site.github.url }}">

  <!-- Add all css files in static_files -->
  <!--
  {% for file in site.static_files %}
    {% if file.path contains '.css' %}
      <link rel="stylesheet"
            href="{{ file.path | prepend: site.github.url }}">
    {%endif%}
  {%endfor%}
  -->

  <link rel="canonical"
        href="{{ page.url | replace:'index.html','' | prepend: site.github.url }}">


  <!-- RSS XML -->

  <!--
  <link rel="alternate"
        type="application/rss+xml"
        title="{{ site.title }}"
        href="{{ "/feed.xml" | prepend: site.github.url }}">
  -->


  <!-- SCRIPTS -->

  <script src="/assets/script.js"></script>
</head>
