<div class="text-block">

    {% if include.data.title %}
    <p class="text-block__title align-center color--accent">
      {{ include.data.title }}
    </p>
    {% endif %}

    {% for paragraph in include.data.paragraphs %}
    <p class="text-block__paragraph color--regular">
      {{ paragraph }}
    </p>
    {% endfor %}

</div>
