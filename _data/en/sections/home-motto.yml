text-block:
  title: Building software from Zaragoza, Spain
  paragraphs:
  - >
    Hi there! My name is Adrián Moreno and I am a professional
    software engineer with 9+ years of experience. I have worked
    at a wide range of companies with different paces, teams and
    environments. From big corporate to small startups, different
    degrees of remote working and different approaches to team
    methodologies, each place allowed me to learn, adapt and become
    a better profesional.
  - > 
    Design patterns, good software architecture, solid testing
    methodologies and general best practices enable me to build and
    deliver complex, robust and maintainable applications. My vast
    experience allows me to find a solid balance between leveraging
    AI tools to do the tedious work, while I focus on the important
    stuff; still being capable of building and debugging code by
    hand when needed.
  - >
    Apart from building software, I also enjoy music, videogames,
    board games and hanging out at a pub with my mates. I love spending
    with my partner and walking my dog in the park.
