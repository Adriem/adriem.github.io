text-block:
  title: It was never about writing code
  paragraphs:
  - >
    Building software was never really about writing code. It was
    always about managing complexity — understanding requirements,
    anticipating how systems will evolve, and ensuring they remain
    maintainable long after the first line is written.
  - >
    The recent wave of AI tooling helps relieve some of the pressure
    of translating ideas into code. But the hard part was never the
    typing. It was holding the full context in your head, making the
    right trade-offs, and knowing what not to build. That kind of
    judgement still requires a human at the wheel — and that is
    exactly where great professionals fit in today.
